<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A house split down the middle: the left half as it was at move-in
       (ember, solid), the right half as it is at move-out (outlined).
       What LeaseResolve does is compare the two halves. -->
  <rect width="64" height="64" rx="18" fill="#070607"/>
  <path d="M32 12 L12 29 V52 H32 Z" fill="#fc5000"/>
  <path d="M32 12 L52 29 V52 H32" fill="none" stroke="#f7f6f2" stroke-width="4" stroke-linejoin="round"/>
  <path d="M32 12 V52" stroke="#070607" stroke-width="2.5"/>
</svg>
